<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Textinho</title>
  <link href="./styles/texto.css" rel="stylesheet">
</head>

<audio autoplay loop>
  <source src="./assets/musicaed.mp3" type="audio/mpeg">
  Seu navegador não suporta áudio.
</audio>

<body>
  <!-- Tela principal -->
  <div class="typing-wrapper">
    <img class="imagem" src="./assets/images/islafoto.jpg" alt="">

    <div class="typing-line linha1">Meus dias são bem mais</div>
    <div class="typing-line linha2">coloridos com você.</div>
    <div class="typing-line linha3">Eu te amo, em corpo e alma.</div>
    <div class="typing-line linha4">Feliz aniversário, minha princesa!</div>

    <div class="feedback-container" id="feedback">
      <p>Gostou?</p>
      <div class="botoes">
        <button onclick="mudarPorcentagem(-10)">-</button>
        <span id="porcentagem">0%</span>
        <button onclick="mudarPorcentagem(10)">+</button>
      </div>
    </div>

    <a class="next-button">Feito com carinho! 💌</a>
  </div>

  <!-- Tela final de "eu te amo" -->
  <div id="tela-eu-te-amo" style="display: none; flex-direction: column; justify-content: center; align-items: center; height: 100vh; text-align: center; background-color: #fff0f5;">
    <h1 style="color: #ff1493; font-size: 6vw;">❤️ EU TE AMO MUITO, MINHA PRINCESA ❤️</h1>
    <p style="font-size: 4vw; color: #db1e76;">Você é a melhor parte da minha vida!</p>
  </div>
</body>

<script>
  let porcentagem = 0;

  function mudarPorcentagem(valor) {
    porcentagem += valor;

    if (porcentagem > 100) porcentagem = 100;
    if (porcentagem < 0) porcentagem = 0;

    document.getElementById('porcentagem').textContent = porcentagem + '%';

    if (porcentagem === 100) {
      setTimeout(() => {
        document.querySelector('.typing-wrapper').style.display = 'none';
        document.getElementById('tela-eu-te-amo').style.display = 'flex';
      }, 1000); // pequeno delay pra dar tempo de curtir o 100%
    }
  }
</script>
</html>
